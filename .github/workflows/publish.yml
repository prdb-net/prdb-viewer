# ADR 0012: release images go to Docker Hub as `prdbnet/prdb-viewer`. Every
# published image carries an immutable commit-SHA tag, a release additionally
# carries its semantic version, and `latest` identifies the newest stable
# release rather than the newest commit.
#
# Emulation is paid for here rather than in CI: one multi-platform build, so the
# second architecture costs only its runtime stage.
name: Publish the image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Two publishes in quick succession would otherwise race for a shared tag, and
# the loser is whichever finishes second rather than whichever is newer.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: prdbnet/prdb-viewer

jobs:
  publish:
    name: Build linux/amd64 and linux/arm64 and push them
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # A fork has neither the account nor any business publishing under this
    # name, and would otherwise get a red build for it on every push.
    if: github.repository == 'prdb-net/prdb-viewer'

    steps:
      - uses: actions/checkout@v5

      # The credential is an account-level Docker Hub access token in the
      # repository secrets. Until it is there this is a warning and a skipped
      # publish rather than a failure: CI still builds, tests, and starts the
      # image on every push, so what is missing is distribution, not proof.
      - name: Docker Hub credentials
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set, so nothing was published."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # The application states its version and commit in its first log line and
      # in every Operator Handoff. A release carries its tag; anything else
      # carries the version in Directory.Build.props with the commit appended,
      # so a report from a `latest` container still names exactly one build.
      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            prefix="$(grep -o '<VersionPrefix>[^<]*' Directory.Build.props | cut -d'>' -f2)"
            version="${prefix}+${GITHUB_SHA}"
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - uses: docker/setup-qemu-action@v3
        if: steps.credentials.outputs.present == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.credentials.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.credentials.outputs.present == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The SHA tag is the one that always exists and always means exactly one
      # commit; the version and `latest` are conveniences on top of it, and
      # `latest` follows stable releases only.
      - name: Work out the tags
        id: metadata
        if: steps.credentials.outputs.present == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - name: Build and push
        if: steps.credentials.outputs.present == 'true'
        run: |
          started=$(date +%s)

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${{ steps.version.outputs.value }}" \
            --build-arg "COMMIT_SHA=${{ github.sha }}" \
            $(echo "${{ steps.metadata.outputs.tags }}" | sed 's/^/--tag /') \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

          echo "seconds=$(($(date +%s) - started))" >> "$GITHUB_ENV"

      - name: How long the multi-architecture build took
        if: always() && steps.credentials.outputs.present == 'true'
        run: |
          {
            echo "| Build | Seconds |"
            echo "| --- | --- |"
            echo "| linux/amd64 + linux/arm64, one invocation, arm64 runtime stage emulated | ${seconds:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"

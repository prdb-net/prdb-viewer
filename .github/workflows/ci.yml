name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and check the API contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Prdb.Viewer.Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/Prdb.Viewer.Frontend

      - name: Check .NET formatting
        run: dotnet format --verify-no-changes

      - name: Build backend and API contract
        run: dotnet build

      - name: Test backend
        run: dotnet test --no-build

      - name: Verify committed API contract
        working-directory: src/Prdb.Viewer.Frontend
        run: |
          npm run generate:api
          if ! git diff --exit-code -- ../Prdb.Viewer.Host/openapi.json src/api/schema.d.ts; then
            echo "::error::The API contract is stale. Run npm run generate:api in src/Prdb.Viewer.Frontend."
            exit 1
          fi

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: src/Prdb.Viewer.Frontend

      - name: Test frontend
        run: npm test
        working-directory: src/Prdb.Viewer.Frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: src/Prdb.Viewer.Frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/Prdb.Viewer.Frontend

  image:
    name: Build and start ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: >-
          docker buildx build
          --platform ${{ matrix.platform }}
          --load
          --tag prdb-viewer:ci
          --build-arg COMMIT_SHA=${{ github.sha }}
          .

      - name: Start and inspect image
        run: docker/smoke-test.sh prdb-viewer:ci

  publish:
    name: Publish release images
    needs: [build, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # Publishing is skipped safely in a fork or wherever registry credentials are
      # unavailable. Build, test, contract, and smoke verification have already run.
      - name: Check registry credentials
        id: registry
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No registry credentials; skipping publication."
          fi

      - name: Determine tags
        id: tags
        if: steps.registry.outputs.available == 'true'
        run: |
          image=prdbnet/prdb-viewer
          tags="$image:${GITHUB_SHA}"
          version=0.0.0-dev

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$tags,$image:$version"

            case "$version" in
              *-*) : ;;
              *) tags="$tags,$image:latest" ;;
            esac
          fi

          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.registry.outputs.available == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.registry.outputs.available == 'true'

      - uses: docker/login-action@v3
        if: steps.registry.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.registry.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

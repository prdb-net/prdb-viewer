name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and check the API contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Prdb.Viewer.Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/Prdb.Viewer.Frontend

      - name: Check .NET formatting
        run: dotnet format --verify-no-changes

      - name: Build backend and API contract
        run: dotnet build

      - name: Test backend
        run: dotnet test --no-build

      - name: Verify committed API contract
        working-directory: src/Prdb.Viewer.Frontend
        run: |
          npm run generate:api
          if ! git diff --exit-code -- ../Prdb.Viewer.Host/openapi.json src/api/schema.d.ts; then
            echo "::error::The API contract is stale. Run npm run generate:api in src/Prdb.Viewer.Frontend."
            exit 1
          fi

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: src/Prdb.Viewer.Frontend

      - name: Test frontend
        run: npm test
        working-directory: src/Prdb.Viewer.Frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: src/Prdb.Viewer.Frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/Prdb.Viewer.Frontend

  image:
    name: Build and start ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: >-
          docker buildx build
          --platform ${{ matrix.platform }}
          --load
          --tag prdb-viewer:ci
          --build-arg COMMIT_SHA=${{ github.sha }}
          .

      - name: Start and inspect image
        run: docker/smoke-test.sh prdb-viewer:ci
